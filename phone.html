<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SOVEAPP</title>
<link rel="icon" href="assets/img/logo-sg.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600&display=swap">
<style>
  /* На большом экране приложение показывается в телефоне: внутри рамки настоящая телефонная вёрстка */
  html, body { margin: 0; height: 100%; }
  body { background: #e9e6e1; font-family: Montserrat, 'Helvetica Neue', Arial, sans-serif; color: #1d1d1d; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 14px; min-height: 100vh; }
  .phone { width: 390px; height: min(844px, calc(100vh - 72px)); background: #fff; border: 10px solid #1d1d1d; border-radius: 44px; overflow: hidden; box-shadow: 0 30px 80px -30px rgba(29,29,29,.6); position: relative; }
  .phone::before { content: ''; position: absolute; top: 9px; left: 50%; width: 96px; height: 24px; margin-left: -48px; background: #1d1d1d; border-radius: 12px; z-index: 2; pointer-events: none; }
  .status { height: 40px; display: flex; align-items: center; justify-content: space-between; padding: 0 26px; font-size: 14px; font-weight: 600; background: #f7f7f7; }
  .status i { font-style: normal; }
  .phone iframe { width: 100%; height: calc(100% - 40px); border: 0; display: block; }
  .cap { font-size: 13px; color: #6b6b6b; display: flex; gap: 16px; align-items: center; }
  .cap a { color: #a05035; }
  @media (max-width: 759px) { body { display: block; background: #fff; } .phone { width: 100%; height: 100vh; border: 0; border-radius: 0; box-shadow: none; } .phone::before { display: none; } .cap { display: none; } .status { display: none; } .phone iframe { height: 100%; } }
</style>
</head>
<body>
  <div class="phone"><div class="status" aria-hidden="true"><i>9:41</i><i>●●● ▲ ▎</i></div><iframe id="app" title="SOVEAPP" src="index.html" allow="clipboard-write"></iframe></div>
  <p class="cap"><span>SOVEAPP, набросок. Это телефонная версия: на компьютере показываем её в рамке.</span><a id="open" href="index.html?noframe=1" target="_blank" rel="noopener">Открыть во всё окно</a></p>
  <script>
    (function () {
      var p = new URLSearchParams(location.search).get('p') || 'index.html';
      if (!/^[\w.-]+\.html(\?[^#]*)?(#.*)?$/.test(p)) p = 'index.html';
      var f = document.getElementById('app'); f.src = p;
      document.getElementById('open').href = p + (p.indexOf('?') < 0 ? '?' : '&') + 'noframe=1';
      /* адрес в строке браузера следует за экраном внутри телефона, чтобы ссылку можно было скопировать */
      f.addEventListener('load', function () { try { var u = f.contentWindow.location; history.replaceState(null, '', 'phone.html?p=' + encodeURIComponent(u.pathname.split('/').pop() + u.search)); document.title = f.contentDocument.title; } catch (e) {} });
    })();
  </script>
</body>
</html>
