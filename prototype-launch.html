<title>Прототип SOVEAPP</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@600&family=Montserrat:wght@500;700&display=swap">
<style>
  /* вход в прототип: сразу переводим в рамку телефона; карточка видна, если переход задержался */
  :root { --bg: #F4F2EE; --card: #FFFFFF; --ink: #1E1C1A; --muted: #6B655F; --accent: #A24E32; --line: #E6E1DA;
          --display: 'Cormorant Garamond', Georgia, serif; --body: Montserrat, Arial, sans-serif; }
  @media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) { --bg: #1E1C1A; --card: #2B2926; --ink: #F4F2EE; --muted: #CFC6BC; --accent: #E0926F; --line: #3A3734; color-scheme: dark } }
  :root[data-theme="dark"] { --bg: #1E1C1A; --card: #2B2926; --ink: #F4F2EE; --muted: #CFC6BC; --accent: #E0926F; --line: #3A3734; color-scheme: dark }
  body { background: var(--bg); color: var(--ink); font-family: var(--body); min-height: 100vh; display: grid; place-items: center;
         padding-block: 32px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); box-sizing: border-box; }
  .card { width: 100%; max-width: 380px; background: var(--card); border: 1px solid var(--line); border-radius: 16px; padding: 22px; display: flex; flex-direction: column; gap: 10px; }
  .k { font-size: 11px; letter-spacing: 2px; font-weight: 700; color: var(--accent); }
  h1 { margin: 0; font-family: var(--display); font-weight: 600; font-size: 32px; line-height: 1; text-wrap: balance; }
  p { margin: 0; font-size: 13px; color: var(--muted); line-height: 1.45; }
  a.go { margin-top: 6px; display: inline-flex; justify-content: center; align-items: center; height: 44px; border-radius: 22px; background: var(--accent); color: #FFFFFF; font-weight: 700; font-size: 14px; text-decoration: none; }
  a.go:focus-visible { outline: 2px solid var(--ink); outline-offset: 2px; }
</style>
<main class="card">
  <span class="k">ПРОТОТИП</span>
  <h1>SOVEAPP</h1>
  <p>Главная, Генерации, Мой ремонт, Заказы и Профиль — в рамке телефона. Данные показные и хранятся только в твоём браузере.</p>
  <a class="go" href="phone.html?p=home-feed.html">Открыть прототип</a>
</main>
<script>
  try { location.replace('phone.html?p=home-feed.html'); } catch (e) {}
</script>
